<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2a3f7a">
<title>Block Rush</title>
<link rel="icon" href="assets/icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<section id="welcome" class="screen">
  <div class="welcome-wrap">
    <img id="welcomeImg" src="assets/welcome.png" alt="Welcome to Block Rush">
    <button id="acceptBtn" class="accept-hit" aria-label="Accept and Let's Fun"></button>
  </div>
</section>

<section id="game" class="screen">
  <div class="game-inner">
    <header class="topbar">
      <div class="crown">
        <svg viewBox="0 0 24 24" width="34" height="34"><path d="M3 18 L5 7 L9 12 L12 5 L15 12 L19 7 L21 18 Z" fill="#ffc83d" stroke="#b7791f" stroke-width="0.6"/></svg>
        <span id="crownScore">0</span>
      </div>
      <button id="soundBtn" class="pill">Sound On</button>
    </header>

    <div class="level-row">
      <span id="levelLabel">LEVEL 1</span>
      <span id="progress">Lines 0/1</span>
    </div>

    <div id="bigScore">0</div>

    <div id="board">
      <div id="grid"></div>
      <div id="fx"></div>
    </div>

    <div id="tray"></div>
  </div>

  <div id="hand" aria-hidden="true">
    <svg viewBox="0 0 24 24" width="56" height="56">
      <path d="M9 1.5a2 2 0 0 1 2 2V10l.5-.1a2 2 0 0 1 2.5 1.9v.6l.4-.1a2 2 0 0 1 2.6 1.9V15a6 6 0 0 1-6 6h-1.2a6 6 0 0 1-4.6-2.2L2.2 14a1.8 1.8 0 0 1 2.6-2.5L7 13.2V3.5a2 2 0 0 1 2-2z" fill="#ffffff" stroke="#1b2a5a" stroke-width="0.8"/>
    </svg>
  </div>
</section>

<div id="notifyModal" class="overlay hidden">
  <div class="card">
    <h2>Notifications</h2>
    <p>Block Rush ko notification bhejne ki ijazat dein?</p>
    <div class="row">
      <button id="notifyNo" class="btn ghost">No</button>
      <button id="notifyYes" class="btn">Allow</button>
    </div>
  </div>
</div>

<div id="levelModal" class="overlay hidden">
  <div class="card">
    <h2>Level Complete!</h2>
    <p id="levelText"></p>
    <button id="nextBtn" class="btn">Next Level</button>
  </div>
</div>

<div id="overModal" class="overlay hidden">
  <div class="card">
    <h2>Game Over</h2>
    <p id="overText"></p>
    <button id="retryBtn" class="btn">Try Again</button>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
